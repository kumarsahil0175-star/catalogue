<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CampusEats Catalogue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CampusEats Catalogue</h1>

    <p class="sub">
        The menu — served by a REST API
    </p>

    <div id="list">Loading...</div>

    <form id="addForm">

        <h3>Add a dish</h3>

        <input
            id="name"
            placeholder="Dish name"
            required
        >

        <input
            id="price"
            type="number"
            placeholder="Price (rupees)"
        >

        <button type="submit">
            Add dish
        </button>

    </form>

    <script>

        // GET REQUEST
        async function load() {

            const res = await fetch('/items');

            const items = await res.json();

            document.getElementById('list').innerHTML =
                items.map(i =>
                    `<div class="dish">
                        <span class="name">${i.name}</span>
                        <span class="price">₹${i.price}</span>
                    </div>`
                ).join('');
        }


        // POST REQUEST
        document.getElementById('addForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const name =
                document.getElementById('name').value;

            const price =
                document.getElementById('price').value;

            await fetch('/items', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    name,
                    price
                })

            });

            e.target.reset();

            load();

        });

        load();

    </script>

</body>
</html>
